<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #slider{
            overflow:hidden;
        }
        #slider figure{
            position: relative ;
            width: 500% ;
            margin: 0;
            left:0 ;
            animation:20s slider infinite;

        }
        #slider figure img{
            float:left;
            width:20%;
        }
        @keyframes slider{
        0%{
            left:0%;
        }
        20%{
            left:0%;
        }
        25%{
            left:-100%;
        }
        45%{
            left:-100%;
        }
        50%{
            left:-200%;
        }
        70%{
            left:-200%;
        }
        75%{
            left:-300%;
        }
        95%{
            left:-300%;
        }
        100%{
            left:-400%;
        }

    }
    </style>
   
</head>
<body>
    <div id="slider">
        <figure>
            <img src="https://tse4.mm.bing.net/th?id=OIP.vpENuVG6_Ke79c0shGAHMQHaFn&pid=Api&P=0&h=180" alt="">
            <img src="https://tse2.mm.bing.net/th?id=OIP.RZit-f8kmjDv27MWUOguJwHaEo&pid=Api&P=0&h=180" alt="">
            <img src="https://tse3.mm.bing.net/th?id=OIP.SlnjMSdNaDSG00NjiyOZEQHaFD&pid=Api&P=0&h=180" alt="">
            <img src="https://images.pexels.com/photos/1108099/pexels-photo-1108099.jpeg?cs=srgb&dl=adorable-animal-breed-1108099.jpg&fm=jpg" alt="">
            <img src="http://3.bp.blogspot.com/-sWdCJqdgrbU/T_peu9rUdVI/AAAAAAAAESE/SpWF93ljOYs/s1600/Beautiful+dog+hd+Wallpapers_1.jpg" alt="">
            <img src="http://2.bp.blogspot.com/-diIVM5ex1sI/UH0-VylgI4I/AAAAAAAAHMw/hwpo10H0674/s1600/38dogs-Cute-Puppies.jpg" alt="">
        </figure>
    </div>
    
</body>
</html>
