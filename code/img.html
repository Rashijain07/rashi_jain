<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>imagerotate</title>
    <style>
        img{
            animation: rotate 3s ease-in-out;
        }
        @keyframes rotate {
            from{
                transform: rotate(0deg);
            }
            to{
                transform: rotate(45deg);
            }
            
        }
    </style>

</head>

    

<body>
    <img src="https://tse2.mm.bing.net/th?id=OIP.sWdOiUhbLF0w0gJ3azjw1gHaEK&pid=Api&P=0&h=180" alt="error hogya">
</body>
</html>
